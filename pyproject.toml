[project]
name = "job-hunter"
version = "1.0.0"
description = "Local-first AI job-hunting agent (Python, Gemini, SQLite)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "HireMeQuackers" }
]
keywords = ["jobs", "ai", "gemini", "sqlite", "cli", "recruitment"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "pydantic>=2",
    "sqlalchemy>=2",
    "python-dotenv>=1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "feedparser>=6",
    "python-docx>=1",
    "reportlab>=4",
]

[project.scripts]
quackers = "quackers.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
]
gemini = [
    "google-genai>=1",
]
pdf = [
    "PyMuPDF>=1",
]
browser = [
    "playwright>=1",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools]
package-dir = { "" = "." }
packages = [
    "config",
    "database",
    "services",
    "sources",
    "quackers",
    "documents",
]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_ignores = true